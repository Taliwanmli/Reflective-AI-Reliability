name: Validate research scaffold

on:
  push:
    branches:
      - main
      - research-scaffold
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install citation validator
        run: python3 -m pip install --disable-pip-version-check "cffconvert==2.0.0"

      - name: Validate sample dataset
        run: python3 scripts/validate_dataset.py data/synthetic-examples.sample.jsonl

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Parse JSON schemas
        run: |
          python3 -m json.tool schemas/reflection.schema.json >/dev/null
          python3 -m json.tool schemas/evaluation.schema.json >/dev/null

      - name: Parse project metadata
        run: python3 -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: Validate citation metadata
        run: cffconvert --validate -i CITATION.cff
